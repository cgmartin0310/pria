services:
  # ── Backend API ──────────────────────────────────────────────────────
  - type: web
    name: pria-api
    runtime: node
    plan: starter
    region: ohio
    buildCommand: |
      npm install -g pnpm &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @pria/shared build &&
      pnpm --filter @pria/backend build
    startCommand: node packages/backend/dist/index.js
    # Runs once per deploy, after build and before the new version takes traffic.
    # Applies any pending Drizzle migrations. Compiled to dist by the build step;
    # the migrate script resolves ./drizzle relative to itself, so CWD (repo root)
    # doesn't matter. Requires DATABASE_URL, which is present in the service env.
    preDeployCommand: node packages/backend/dist/db/migrate.js && node packages/backend/dist/db/seed-clearinghouses.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: pria-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pria-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # 32-byte base64 key encrypting stored credentials (portal logins,
      # clearinghouse secrets). Generate:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      # Comma-separated emails allowed to manage platform-wide portal recipes.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGIN
        value: https://pria-app.onrender.com
    healthCheckPath: /api/health

  # ── Frontend Static Site ─────────────────────────────────────────────
  - type: web
    name: pria-app
    runtime: static
    buildCommand: |
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @pria/shared build &&
      pnpm --filter @pria/frontend build
    staticPublishPath: packages/frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pria-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://pria-api.onrender.com
      # Clerk publishable key — inlined into the bundle at BUILD time by Vite.
      # Set the value in the Render dashboard (Environment). Must be the key from
      # the SAME Clerk instance whose secret key is set on pria-api.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # ── Redis ────────────────────────────────────────────────────────────
  - type: redis
    name: pria-redis
    plan: free
    region: ohio
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ── PostgreSQL ───────────────────────────────────────────────────────
  - name: pria-db
    plan: free
    region: ohio
    databaseName: pria
    postgresMajorVersion: "16"
    ipAllowList: []
