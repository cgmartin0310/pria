services:
  # ── Backend API ──────────────────────────────────────────────────────
  - type: web
    name: pria-api
    runtime: node
    plan: starter
    region: ohio
    buildCommand: |
      npm install -g pnpm &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @pria/shared build &&
      pnpm --filter @pria/backend build
    startCommand: node packages/backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: pria-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pria-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://pria-app.onrender.com
    healthCheckPath: /api/health

  # ── Frontend Static Site ─────────────────────────────────────────────
  - type: web
    name: pria-app
    runtime: static
    buildCommand: |
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @pria/shared build &&
      pnpm --filter @pria/frontend build
    staticPublishPath: packages/frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pria-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pria-api.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # ── Redis ────────────────────────────────────────────────────────────
  - type: redis
    name: pria-redis
    plan: free
    region: ohio
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ── PostgreSQL ───────────────────────────────────────────────────────
  - name: pria-db
    plan: free
    region: ohio
    databaseName: pria
    postgresMajorVersion: "16"
    ipAllowList: []
